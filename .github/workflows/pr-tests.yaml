name: Tests

on:
  pull_request:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libhdf5-dev gcc clang cmake git pkg-config
          echo "LIBRARY_PATH=$(pkg-config --variable=libdir hdf5)${LIBRARY_PATH:+:$LIBRARY_PATH}" >> "$GITHUB_ENV"
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: actions/checkout@v4
      - name: Cargo fmt
        run: cargo fmt --all -- --check
      - name: Run test suite
        run: cargo test

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Install HDF5
        run: vcpkg install hdf5:x64-windows
      - name: Configure native dependencies
        shell: pwsh
        run: |
          "CMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" >> $env:GITHUB_ENV
          "LIBCLANG_PATH=C:/Program Files/LLVM/bin" >> $env:GITHUB_ENV
          "LIB=$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/lib;$env:LIB" >> $env:GITHUB_ENV
          "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin" >> $env:GITHUB_PATH
      - name: Run test suite
        # Use release HDF5 libraries and the matching MSVC runtime.
        run: cargo test --workspace --release

  lint:
    name: Typos
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Check spelling
      uses: crate-ci/typos@v1.0.4
